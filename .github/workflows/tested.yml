name: Mark deal tested

# The "Mark tested today" link on the site opens an issue titled
# "tested: <deal id>". Only issues opened by the repo owner count.
on:
  issues:
    types: [opened]

permissions:
  contents: write
  issues: write

jobs:
  mark:
    if: startsWith(github.event.issue.title, 'tested:') && github.event.issue.user.login == github.repository_owner
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Record it
        env:
          ISSUE_TITLE: ${{ github.event.issue.title }}
        run: python mark_tested.py
      - name: Save and close
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add data/tested.json
          git diff --cached --quiet || git commit -m "Mark deal tested"
          git pull --rebase -q && git push
          gh issue close ${{ github.event.issue.number }} --comment "Marked as tested today. The website updates in about a minute."
