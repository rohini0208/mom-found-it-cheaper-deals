name: feedtest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          H={"User-Agent":"Mozilla/5.0 (compatible; deal-bot)"}
          def g(u): return urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=25).read().decode("utf8","ignore")
          for k,u in {"TB":"https://www.techbargains.com/rss.xml","HIP":"https://hip2save.com/feed/"}.items():
              x=g(u); it=x.split("<item>")[1:3]
              for i in it: print("S",k,re.sub(r"\s+"," ",i)[:1500])
          x=g("https://www.amazon.com/gp/goldbox")
          print("S GB captcha?",bool(re.search("captcha|robot",x,re.I)),"asins",len(set(re.findall(r"/dp/(B[0-9A-Z]{9})",x))),"imgs",re.findall(r"https://m\.media-amazon\.com/images/I/[^\"' ]+",x)[:3])
          print("S GB title",re.findall(r"<title>([^<]*)",x)[:1])
          PY
