name: imgtest
on: workflow_dispatch
jobs:
  t:
    runs-on: ubuntu-latest
    steps:
      - run: |
          python3 - <<'PY'
          import urllib.request,re
          H={"User-Agent":"Mozilla/5.0"}
          def get(u,b=False):
              r=urllib.request.urlopen(urllib.request.Request(u,headers=H),timeout=30).read()
              return r if b else r.decode("utf8","ignore")
          x=get("https://slickdeals.net/newsearch.php?mode=frontpage&searcharea=deals&searchin=first&rss=1")
          it=x.split("<item>")[1:3]
          for i in it: print("ITEM:",i[:1800].replace("\n"," "));print()
          print("cdn refs:",re.findall(r'https?://[^"\s<>]*slickdeals[^"\s<>]*(?:attachment|thumb|image)[^"\s<>]*',x)[:5])
          link=re.search(r"<link>([^<]+)</link>",it[0]).group(1)
          print("deal link",link)
          try:
              p=get(link)
              print("page len",len(p),re.findall(r'og:image"[^>]*content="([^"]+)"',p)[:2] or re.findall(r'content="([^"]+)"[^>]*og:image',p)[:2])
              print(re.findall(r'https://static\.slickdealscdn\.com[^"\s<>]+',p)[:5])
          except Exception as e: print("page fail",e)
          for a in ["B0C4YTB56H"]:
              for u in ["https://camelcamelcamel.com/product/"+a,"https://www.amazon.com/dp/"+a]:
                  try:
                      p=get(u);print(u,len(p),re.findall(r'(?:og:image"[^>]*content|src)="([^"]+\.(?:jpg|png))',p)[:4])
                  except Exception as e: print(u,"fail",e)
          PY
