name: Make deal videos and viral list

on:
  schedule:
    - cron: "41 12 * * *"    # every day, 7:41 AM New York time (winter)
  workflow_dispatch: {}

permissions:
  contents: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install pillow edge-tts
      - name: Viral product list (skipped until YT_API_KEY is added)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python viral_finder.py
      - name: Make today's videos
        env:
          VOICE: ${{ vars.VOICE }}
          AB_VOICE: ${{ vars.AB_VOICE }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python make_videos.py
      - name: Save lists
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add data/videos_made.json
          if [ -f VIRAL.md ]; then git add VIRAL.md data/viral.json; fi
          git diff --cached --quiet || git commit -m "Update videos list"
          git pull --rebase -q && git push
      - name: Publish videos to the "Today's videos" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete todays-videos --yes --cleanup-tag || true
          ls videos/*.mp4 >/dev/null 2>&1 || { echo "No new deals for videos today"; exit 0; }
          gh release create todays-videos videos/* \
            --title "Today's videos ($(date -u +%Y-%m-%d))" \
            --notes "Download a video and its .txt caption. Check the price first, then post with your own SiteStripe link in the group."
