name: Make deal videos and viral list

on:
  schedule:
    - cron: "41 12 * * *"    # every day, 7:41 AM New York time (winter)
  workflow_dispatch: {}

permissions:
  contents: write
  issues: write

jobs:
  videos:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install video tools
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg
          pip install pillow edge-tts
      - name: Viral product list (skipped until YT_API_KEY is added)
        env:
          YT_API_KEY: ${{ secrets.YT_API_KEY }}
        run: python viral_finder.py
      - name: Quality report
        run: python qa.py
      - name: Make today's videos
        env:
          VOICE: ${{ vars.VOICE }}
          AB_VOICE: ${{ vars.AB_VOICE }}
          VIDEOS_PER_RUN: ${{ vars.VIDEOS_PER_RUN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
        run: python make_videos.py
      - name: Make today's collage posts
        run: python make_posts.py
      - name: Post QA (blocks bad posts before they go out)
        run: python post_qa.py
      - name: Build approval queue
        run: python make_queue.py
      - name: Save lists
        run: |
          git config user.name "deal-bot"
          git config user.email "deal-bot@users.noreply.github.com"
          git add data/videos_made.json data/posts_made.json QA_REPORT.md POST_QA.md queue; git add -A webposts 2>/dev/null || true
          if [ -f VIRAL.md ]; then git add VIRAL.md data/viral.json; fi
          git diff --cached --quiet || git commit -m "Update videos list"
          git pull --rebase -X theirs -q && git push
      - name: Publish videos to the "Today's videos" release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release delete todays-videos --yes --cleanup-tag || true
          files=$(ls videos/* posts/*.png posts/*.txt 2>/dev/null || true)
          [ -n "$files" ] || { echo "Nothing new today"; exit 0; }
          gh release create todays-videos $files \
            --title "Today's videos and posts ($(date -u +%Y-%m-%d))" \
            --notes "Videos: download a video and its .txt caption. Posts: download post_N.png and paste the caption and first comment from post_N.txt. Check the price first, then post with your own SiteStripe link in our group only. Do not post our group link in other groups without moderator permission."
      - name: Open today's approval issue (approve by comment; nothing auto-posts)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          title="Approval queue $(date -u +%Y-%m-%d)"
          gh issue list --label approval --state open --json number -q '.[].number' | xargs -r -I{} gh issue close {} -c "Superseded by today's queue" || true
          gh label create approval -c "#B84300" -d "Daily approval queue" 2>/dev/null || true
          gh issue create --title "$title" --label approval --body-file queue/QUEUE.md
