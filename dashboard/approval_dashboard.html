<style>
/* Layout: sticky bar with workflow switcher; Overview grid of channel health cards -> drill into one channel's approval queue of true-to-life previews. */
:root{
  --bg:#f6f3ec; --panel:#fffdf8; --ink:#241f18; --muted:#6c6457; --line:#e4ddcf;
  --gold:#c8862a; --good:#2f8f54; --warn:#c8871b; --bad:#c0392b;
  --good-bg:#e7f3ec; --warn-bg:#faf0dc; --bad-bg:#f8e6e3; --idle-bg:#ede7da;
  color-scheme:light;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --bg:#17140f; --panel:#201c15; --ink:#f0ebe0; --muted:#a79d8b; --line:#342e24;
  --gold:#e0a84e; --good:#58c483; --warn:#e0a84e; --bad:#e2675a;
  --good-bg:#15271d; --warn-bg:#2a2112; --bad-bg:#2c1714; --idle-bg:#262016; color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#17140f; --panel:#201c15; --ink:#f0ebe0; --muted:#a79d8b; --line:#342e24;
  --gold:#e0a84e; --good:#58c483; --warn:#e0a84e; --bad:#e2675a;
  --good-bg:#15271d; --warn-bg:#2a2112; --bad-bg:#2c1714; --idle-bg:#262016; color-scheme:dark;
}
*{box-sizing:border-box}
body{background:var(--bg);color:var(--ink);font-family:Inter,system-ui,sans-serif;margin:0;line-height:1.45}
.wrap{max-width:1160px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}
h1,h2,h3{font-family:"Space Grotesk",system-ui,sans-serif;margin:0}
a{color:var(--gold)}
button{font-family:inherit}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--panel);border-bottom:1px solid var(--line)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--panel)}
.barin{display:flex;flex-wrap:wrap;align-items:center;gap:10px 16px;padding-block:13px}
.barin h1{font-size:1.12rem;letter-spacing:.2px}
.barin h1 small{display:block;font-family:Inter;font-weight:400;font-size:.72rem;color:var(--muted);letter-spacing:0}
.switch{display:flex;gap:6px;flex-wrap:wrap;margin-left:auto}
.swbtn{font-family:"Space Grotesk";font-size:.84rem;padding:6px 12px;border-radius:999px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
.swbtn[aria-current="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.crumb{display:flex;align-items:center;gap:8px;padding-block:14px;font-size:.9rem;color:var(--muted)}
.crumb button{background:none;border:none;color:var(--gold);cursor:pointer;font-size:.9rem;padding:0}
/* overview */
.ov{display:grid;grid-template-columns:repeat(auto-fill,minmax(280px,1fr));gap:16px;padding-bottom:40px}
.wf{background:var(--panel);border:1px solid var(--line);border-radius:16px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0;cursor:pointer}
.wf:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.wf.off{opacity:.68;cursor:default}
.wf h3{font-size:1.02rem}
.wf .chan{font-size:.74rem;color:var(--muted);text-transform:uppercase;letter-spacing:.07em}
.pills{display:flex;flex-wrap:wrap;gap:6px}
.pill{font-size:.75rem;padding:3px 9px;border-radius:999px;border:1px solid var(--line);font-variant-numeric:tabular-nums}
.pill.good{background:var(--good-bg);color:var(--good);border-color:transparent}
.pill.warn{background:var(--warn-bg);color:var(--warn);border-color:transparent}
.pill.bad{background:var(--bad-bg);color:var(--bad);border-color:transparent}
.pill.idle{background:var(--idle-bg);color:var(--muted);border-color:transparent}
.wf .run{font-size:.78rem;color:var(--muted)}
.wf .open{align-self:flex-start;font-family:"Space Grotesk";font-weight:600;font-size:.82rem;padding:7px 13px;border-radius:9px;border:1px solid var(--line);background:var(--bg);color:var(--ink);cursor:pointer}
/* detail */
.tally{display:flex;gap:8px;flex-wrap:wrap;padding-block:4px 10px}
.chip{font-size:.78rem;padding:4px 10px;border-radius:999px;border:1px solid var(--line);background:var(--panel);font-variant-numeric:tabular-nums}
.chip.attn{color:var(--bad);border-color:var(--bad)}
.tabs{display:flex;gap:6px;flex-wrap:wrap;padding-block:6px}
.tab{font-family:"Space Grotesk";font-size:.9rem;padding:7px 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
.tab[aria-selected="true"]{background:var(--ink);color:var(--bg);border-color:var(--ink)}
.note{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:11px 14px;margin-block:10px;font-size:.84rem;color:var(--muted)}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:18px;padding-bottom:40px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:16px;overflow:hidden;display:flex;flex-direction:column;min-width:0}
.card.approved{border-color:var(--good)}
.card.rejected{opacity:.55}
.media{background:#000;display:flex;align-items:center;justify-content:center;max-height:420px;overflow:hidden}
.media img,.media video{width:100%;height:auto;display:block;max-height:420px;object-fit:contain}
.cbody{padding:12px 14px;display:flex;flex-direction:column;gap:10px;min-width:0}
.ttl{font-family:"Space Grotesk";font-weight:700;font-size:.98rem;text-wrap:balance}
.kind{font-size:.68rem;text-transform:uppercase;letter-spacing:.09em;color:var(--muted)}
.fb{border:1px solid var(--line);border-radius:10px;padding:10px;background:var(--bg);font-size:.85rem;white-space:pre-wrap;word-break:break-word;min-width:0}
.fb .cmt{margin-top:8px;padding-top:8px;border-top:1px dashed var(--line);color:var(--muted);font-size:.8rem}
.lnk{font-size:.8rem;word-break:break-all}
.qa{display:flex;flex-direction:column;gap:6px}
.qa .row{display:flex;gap:8px;align-items:flex-start;font-size:.8rem}
.dot{flex:none;margin-top:3px;width:9px;height:9px;border-radius:50%}
.dot.good{background:var(--good)}.dot.warn{background:var(--warn)}.dot.bad{background:var(--bad)}.dot.pending{background:var(--muted)}
.verdict{display:inline-flex;align-items:center;gap:7px;font-size:.78rem;font-weight:600;padding:4px 10px;border-radius:999px;align-self:flex-start}
.verdict.good{background:var(--good-bg);color:var(--good)}
.verdict.warn{background:var(--warn-bg);color:var(--warn)}
.verdict.bad{background:var(--bad-bg);color:var(--bad)}
.verdict.pending{background:var(--bg);color:var(--muted);border:1px solid var(--line)}
.status{font-size:.76rem;font-weight:600;padding:3px 9px;border-radius:999px;align-self:flex-start}
.status.published{background:var(--good-bg);color:var(--good)}
.status.error{background:var(--bad-bg);color:var(--bad)}
.acts{display:flex;gap:8px;margin-top:2px}
.btn{flex:1;font-family:"Space Grotesk";font-weight:600;font-size:.85rem;padding:9px;border-radius:10px;border:1px solid var(--line);cursor:pointer;background:var(--bg);color:var(--ink)}
.btn.ok[aria-pressed="true"]{background:var(--good);border-color:var(--good);color:#fff}
.btn.no[aria-pressed="true"]{background:var(--bad);border-color:var(--bad);color:#fff}
.btn:focus-visible{outline:2px solid var(--gold);outline-offset:2px}
.foot{display:flex;flex-wrap:wrap;gap:10px;align-items:center;padding-block:16px;border-top:1px solid var(--line);margin-top:8px;font-size:.82rem;color:var(--muted)}
.foot button{font-family:"Space Grotesk";font-weight:600;padding:8px 14px;border-radius:10px;border:1px solid var(--line);background:var(--panel);color:var(--ink);cursor:pointer}
</style>

let DECISIONS = {}; try{ DECISIONS = JSON.parse(localStorage.getItem("ccc_decisions")||"{}"); }catch(e){}
const esc = s => (s==null?"":String(s)).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));
const vRank = v => ["pass","warn","fail"].indexOf(v);
const vClass = v => ({pass:"good",warn:"warn",fail:"bad"}[v]||"pending");
const items = q => q ? [...(q.pins||[]),...(q.posts||[]),...(q.reels||[])] : [];

function qaVerdict(it){
  const m=(it.qa&&it.qa.models)||[]; if(!m.length) return {cls:"pending",label:"QA pending"};
  const worst=m.reduce((a,x)=> vRank(x.verdict)>vRank(a)?x.verdict:a,"pass");
  return {cls:vClass(worst),label:worst==="pass"?"QA passed":worst==="warn"?"QA: check":"QA: fix"};
}
function judgePill(it){
  const jd=it.judge; if(!jd||jd.score==null) return `<span class="verdict pending">Judge: scoring…</span>`;
  const cls=jd.pass?"good":(jd.score>=jd.bar-2?"warn":"bad");
  return `<span class="verdict ${cls}">Judge ${jd.score}/10 · bar ${jd.bar}</span>`;
}
function needsAttention(it){ return qaVerdict(it).cls==="bad" || it.status==="error" || (it.judge&&it.judge.pass===false); }
function wfHealth(w){
  const its=items(w.queue);
  const pending=its.filter(it=>DECISIONS[dk(w.id,it.id)]!=="approve"&&DECISIONS[dk(w.id,it.id)]!=="reject").length;
  const attn=its.filter(needsAttention).length;
  const appr=its.filter(it=>DECISIONS[dk(w.id,it.id)]==="approve").length;
  return {total:its.length,pending,attn,appr};
}
const dk=(wf,id)=>wf+"::"+id;

function overview(){
  const cards = INDEX.workflows.map(w=>{
    if(w.state!=="live" || !w.queue){
      return `<div class="wf off" tabindex="-1"><div><div class="chan">${esc(w.channel||"")}</div><h3>${esc(w.name)}</h3></div>
        <div class="pills"><span class="pill idle">Not wired yet</span></div>
        <div class="run">Add its queue file to bring it online here.</div></div>`;
    }
    const h=wfHealth(w);
    const rs=(w.last_run&&w.last_run.status)||"";
    const runPill = rs==="ok"?`<span class="pill good">Last run ok</span>`:rs==="error"?`<span class="pill bad">Last run failed</span>`:`<span class="pill idle">No run yet</span>`;
    return `<div class="wf" role="button" tabindex="0" data-open="${esc(w.id)}">
      <div><div class="chan">${esc(w.channel||"")}</div><h3>${esc(w.name)}</h3></div>
      <div class="pills">
        ${runPill}
        <span class="pill ${h.pending?"warn":"good"}">${h.pending} to approve</span>
        ${h.attn?`<span class="pill bad">${h.attn} need attention</span>`:`<span class="pill good">0 flagged</span>`}
        <span class="pill idle">${h.appr} approved</span>
      </div>
      <div class="run">${w.last_run?("Last run "+esc(w.last_run.at||"")):""} · ${h.total} items today</div>
      <button class="open" data-open="${esc(w.id)}">Review →</button>
    </div>`;
  }).join("");
  return `<div class="crumb"><strong>Overview</strong> · ${INDEX.workflows.length} workflows</div><div class="ov">${cards}</div>`;
}

let TAB="pins";
function detail(w){
  const q=w.queue, its=items(q);
  const attn=its.filter(needsAttention).length;
  const appr=its.filter(it=>DECISIONS[dk(w.id,it.id)]==="approve").length;
  const groups={pins:q.pins||[],posts:q.posts||[],reels:q.reels||[]};
  const tabs=Object.entries(groups).map(([k,v])=>`<button class="tab" data-tab="${k}" aria-selected="${k===TAB}">${k[0].toUpperCase()+k.slice(1)} (${v.length})</button>`).join("");
  const cards=(groups[TAB]||[]).map(it=>card(w,it)).join("")||"<p>Nothing in this group today.</p>";
  return `<div class="crumb"><button data-home>Overview</button> › <strong>${esc(w.name)}</strong> <span>· ${esc((q&&q.date)||"")}</span></div>
    <div class="tally">
      <span class="chip"><b>${its.length}</b> items</span>
      <span class="chip"><b>${appr}</b> approved</span>
      ${attn?`<span class="chip attn"><b>${attn}</b> need attention</span>`:`<span class="chip"><b>0</b> flagged</span>`}

}

function media(it){
  if(it.type==="reel"&&it.video_url) return `<div class="media"><video controls preload="metadata" playsinline src="${esc(it.video_url)}"></video></div>`;

  return "";
}
function qaRows(it){
  const m=(it.qa&&it.qa.models)||[];
  if(!m.length) return `<div class="qa"><div class="row"><span class="dot pending"></span><span>No QA yet — OmniRoute free models score each item before it reaches you.</span></div></div>`;
  return `<div class="qa">`+m.map(x=>`<div class="row"><span class="dot ${vClass(x.verdict)}"></span><span style="font-weight:600;min-width:64px">${esc(x.model)}</span><span>${esc(x.note||x.verdict)}</span></div>`).join("")+`</div>`;
}
function statusBadge(it){
  if(it.status==="published") return `<span class="status published">✓ Published${it.published_at?" · "+esc(it.published_at):""}</span>`;
  if(it.status==="error") return `<span class="status error">⚠ Publish error: ${esc(it.error||"see logs")}</span>`;
  return "";
}
function card(w,it){
  const key=dk(w.id,it.id), dec=DECISIONS[key]||"", qv=qaVerdict(it);
  const cmt=it.comment?`<div class="cmt">💬 First comment: ${esc(it.comment)}</div>`:"";
  return `<div class="card ${dec==="approve"?"approved":dec==="reject"?"rejected":""}" data-id="${esc(it.id)}">
    ${media(it)}
    <div class="cbody">
      <div class="kind">${esc(it.type)} · ${esc(it.id)}</div>
      <div class="ttl">${esc(it.title)}</div>
      <span class="verdict ${qv.cls}">${esc(qv.label)}</span>
      ${judgePill(it)}
      ${statusBadge(it)}
      <div class="fb">${esc(it.caption)}${cmt}</div>
      ${it.link?`<a class="lnk" href="${esc(it.link)}" target="_blank" rel="noopener">${esc(it.link)}</a>`:""}
      ${qaRows(it)}
      <div class="acts"><button class="btn ok" aria-pressed="${dec==="approve"}" data-act="approve">Approve</button>
        <button class="btn no" aria-pressed="${dec==="reject"}" data-act="reject">Reject</button></div>
    </div></div>`;
}

function growthView(){
  const g=INDEX.growth||{};
  const tiles=(g.metrics||[]).map(m=>`<div class="wf" style="cursor:default"><div class="chan">${esc(m.k)}</div>
    <div style="font-family:'Space Grotesk';font-weight:700;font-size:1.6rem;font-variant-numeric:tabular-nums">${esc(m.v)}</div>
    <div class="run">${esc(m.note||"")}</div></div>`).join("");
  const plays=(g.plays||[]).map(p=>`<div class="card"><div class="cbody">
    <span class="verdict ${p.rule==="required"?"warn":"good"}">${p.rule==="required"?"Required":"Rule-safe"}</span>
    <div class="ttl" style="font-size:.95rem">${esc(p.do)}</div>
    <div class="run">${esc(p.why)}</div></div></div>`).join("");
  const avoid=(g.avoid||[]).map(a=>`<div class="qa"><div class="row"><span class="dot bad"></span><span>${esc(a)}</span></div></div>`).join("");
  return `<div class="crumb"><button data-home>Overview</button> › <strong>Growth</strong> <span>· updated ${esc(g.updated||"")}</span></div>
    <div class="note">Goal: grow the group and drive Amazon Associate sales (first 3 → 10) without breaking a single platform rule. Metrics fill in from Facebook, Pinterest and Amazon Associates; plays below are re-scored daily and the safe ones feed back into the posting workflow.</div>
    <h2 style="margin:14px 0 8px">This week</h2><div class="ov">${tiles}</div>
    <h2 style="margin:18px 0 8px">Today’s plays <span style="font-family:Inter;font-weight:400;font-size:.8rem;color:var(--muted)">— rule-checked</span></h2><div class="grid">${plays}</div>
    <h2 style="margin:18px 0 8px">Never do</h2><div style="background:var(--panel);border:1px solid var(--line);border-radius:14px;padding:14px 16px;margin-bottom:40px">${avoid}</div>`;
}

let VIEW="overview";
function wf(id){ return INDEX.workflows.find(w=>w.id===id); }
function render(){
  const app=document.getElementById("app");
  const live=INDEX.workflows.filter(w=>w.state==="live");
  document.getElementById("switch").innerHTML =
    `<button class="swbtn" data-home aria-current="${VIEW==="overview"}">Overview</button>`+
    `<button class="swbtn" data-growth aria-current="${VIEW==="growth"}">Growth</button>`+
    live.map(w=>`<button class="swbtn" data-open="${w.id}" aria-current="${VIEW===w.id}">${esc(w.name.split(" ")[0])}</button>`).join("");
  app.innerHTML = VIEW==="overview" ? overview() : VIEW==="growth" ? growthView() : detail(wf(VIEW));
}

document.addEventListener("click", e=>{
  const home=e.target.closest("[data-home]"); if(home){ VIEW="overview"; render(); return; }
  const gr=e.target.closest("[data-growth]"); if(gr){ VIEW="growth"; render(); return; }
  const op=e.target.closest("[data-open]"); if(op){ const id=op.getAttribute("data-open"); if(wf(id)&&wf(id).queue){ VIEW=id; TAB="pins"; render(); } return; }
  const tab=e.target.closest(".tab"); if(tab){ TAB=tab.dataset.tab; render(); return; }
  const b=e.target.closest(".btn"); if(b){
    const id=e.target.closest(".card").dataset.id, act=b.dataset.act, key=dk(VIEW,id);
    DECISIONS[key]=DECISIONS[key]===act?"":act;
    try{ localStorage.setItem("ccc_decisions",JSON.stringify(DECISIONS)); }catch(_){}
    if(WORKER_URL&&DECISIONS[key]) fetch(WORKER_URL.replace(/\/$/,"")+"/approve",{method:"POST",headers:{"Content-Type":"application/json"},body:JSON.stringify({workflow:VIEW,date:wf(VIEW).queue.date,id,decision:DECISIONS[key]})}).catch(()=>{});
    render(); return;
  }
  const ex=e.target.closest("#export"); if(ex){
    const w=wf(VIEW), out={workflow:VIEW,date:w.queue.date,approved:[],rejected:[]};
    items(w.queue).forEach(it=>{const d=DECISIONS[dk(VIEW,it.id)]; if(d==="approve")out.approved.push(it.id); if(d==="reject")out.rejected.push(it.id);});
    const txt=JSON.stringify(out,null,2);
    navigator.clipboard?.writeText(txt).then(()=>{ex.textContent="Copied ✓";setTimeout(()=>ex.textContent="Copy approved list (JSON)",1500);}).catch(()=>{ex.textContent=txt.slice(0,40)+"…";});
  }
});
document.addEventListener("keydown", e=>{ if(e.key==="Enter"){ const op=e.target.closest&&e.target.closest("[data-open]"); if(op){op.click();} }});

render();
// Live central index + per-workflow status (optional; falls back to embedded).
(async function(){
  try{ const r=await fetch(INDEX_URL,{cache:"no-store"}); if(r.ok){ const idx=await r.json();
    // merge: fetch each live workflow's queue_url if provided
    for(const w of idx.workflows){ if(w.queue_url&&!w.queue){ try{const qr=await fetch(w.queue_url,{cache:"no-store"}); if(qr.ok)w.queue=await qr.json();}catch(_){}} }
    INDEX=idx; render(); } }catch(e){}
})();
</script>
